<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LED Game 厂家激活码签发工具</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; padding: 28px; background: #101a29; color: #eaf1fa; font-family: 'Microsoft YaHei', sans-serif; }
    h1 { font-size: 24px; margin: 0 0 10px; } p { color: #b6c5d8; font-size: 14px; line-height: 1.6; }
    label { display: block; margin: 20px 0 8px; } textarea, input { width: 100%; padding: 12px; border: 1px solid #4b607a; border-radius: 8px; background: #19283d; color: #edf6ff; font: 14px Consolas, monospace; }
    textarea { resize: vertical; min-height: 74px; } #result { min-height: 106px; } button { margin-top: 10px; padding: 10px 16px; border: 0; border-radius: 7px; background: #52d4b5; color: #092219; cursor: pointer; font: inherit; font-size: 14px; }
    button:disabled { opacity: .45; cursor: default; } :focus-visible { outline: 2px solid #7edcff; outline-offset: 2px; } #status { min-height: 24px; margin: 12px 0 0; color: #f5cd80; font-size: 14px; }
  </style>
</head>
<body>
  <h1>厂家激活码签发工具</h1>
  <p>离线签发 · 永久授权<br>私钥仅供厂家保管，不要把私钥文件发给客户。</p>
  <label for="key-path">1. 厂家私钥（只记住路径，不复制私钥）</label>
  <input id="key-path" readonly placeholder="请选择厂家私钥 txt 或 pem 文件">
  <button id="choose">选择私钥</button>
  <label for="machine">2. 粘贴客户机器码</label>
  <textarea id="machine" maxlength="256" spellcheck="false" placeholder="LGM1-…（支持 Ctrl+V）"></textarea>
  <button id="issue">生成激活码</button>
  <label for="result">3. 将完整激活码发给客户</label>
  <textarea id="result" readonly spellcheck="false" placeholder="生成后显示在这里"></textarea>
  <button id="copy" disabled>复制激活码</button>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="renderer.js"></script>
</body>
</html>
