spring:
  application:
    name: ledgame-platform-server
  datasource:
    url: jdbc:sqlite:${PLATFORM_DB_PATH:./platform.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: ${LEDGAME_SQLITE_CONNECTION_TIMEOUT_MILLIS:10000}
      data-source-properties:
        journal_mode: WAL
        busy_timeout: ${ledgame.sqlite.busy-timeout-millis:${LEDGAME_SQLITE_BUSY_TIMEOUT_MILLIS:5000}}
        transaction_mode: IMMEDIATE
  sql:
    init:
      mode: always

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8090}

# 即使运行环境误设 DEBUG，也禁止框架把请求/响应正文、CSV 字节或 JDBC 参数写入 server.log。
logging:
  level:
    org.springframework.web.client.RestTemplate: WARN
    org.springframework.web.HttpLogging: WARN
    org.springframework.web.servlet.mvc.method.annotation: WARN
    org.springframework.jdbc.core: WARN

ledgame:
  time-zone: ${PLATFORM_TIME_ZONE:Asia/Shanghai}
  sqlite:
    busy-timeout-millis: ${LEDGAME_SQLITE_BUSY_TIMEOUT_MILLIS:5000}
  data-protection:
    key-path: ${PLATFORM_DATA_KEY_PATH:}
    test-key-base64: ${PLATFORM_DATA_TEST_KEY_BASE64:}
  operator-accounts:
    factory:
      username: ${PLATFORM_FACTORY_ADMIN_USERNAME:admin}
      password: ${PLATFORM_FACTORY_ADMIN_PASSWORD:888888}
      display-name: ${PLATFORM_FACTORY_ADMIN_DISPLAY_NAME:出厂管理员}
  room-connection:
    enabled: ${LED_ROOM_CONNECTION_ENABLED:true}
  database-backup:
    enabled: ${PLATFORM_DATABASE_BACKUP_ENABLED:true}
    environment: ${PLATFORM_DATABASE_BACKUP_ENVIRONMENT:PRODUCTION}
    root-override: ${PLATFORM_DATABASE_BACKUP_ROOT:}
    poll-millis: ${PLATFORM_DATABASE_BACKUP_POLL_MILLIS:1000}
    debounce-millis: ${PLATFORM_DATABASE_BACKUP_DEBOUNCE_MILLIS:1000}
    max-dirty-millis: ${PLATFORM_DATABASE_BACKUP_MAX_DIRTY_MILLIS:5000}
    retry-millis: ${PLATFORM_DATABASE_BACKUP_RETRY_MILLIS:15000}
    shutdown-timeout-millis: ${PLATFORM_DATABASE_BACKUP_SHUTDOWN_TIMEOUT_MILLIS:15000}
    retention-days: ${PLATFORM_DATABASE_BACKUP_RETENTION_DAYS:30}
    minimum-free-bytes: ${PLATFORM_DATABASE_BACKUP_MINIMUM_FREE_BYTES:104857600}
