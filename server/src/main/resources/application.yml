spring:
  application:
    name: ledgame-platform-server
  datasource:
    url: jdbc:sqlite:${PLATFORM_DB_PATH:./platform.db}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always

server:
  port: 8090

ledgame:
  room-connection:
    enabled: ${LED_ROOM_CONNECTION_ENABLED:true}
    token: ${LED_ROOM_CONNECTION_TOKEN:dev-room-token}
